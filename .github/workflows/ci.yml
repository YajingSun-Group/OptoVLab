name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.8.12"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test platform services
        run: uv run pytest tests/mining_platform tests/optovlab tests/database_site
      - name: Audit public release
        run: uv run python scripts/check_public_release.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/database-web/package-lock.json
      - name: Build agent workbench
        run: npm --prefix apps/web ci && npm --prefix apps/web run build
      - name: Build database browser
        run: npm --prefix apps/database-web ci && npm --prefix apps/database-web run build
