[project]
name = "optovlab"
version = "0.1.0"
description = "A self-improving agentic virtual laboratory for organic optoelectronic research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "Qian Zhang" },
  { name = "Yongxu Hu" },
  { name = "Zhiyao Su" },
  { name = "Jingsheng Miao" },
  { name = "Xiaoyu Guo" },
  { name = "Nengquan Li" },
  { name = "Chuluo Yang" },
  { name = "Yajing Sun" },
  { name = "Wenping Hu" },
]
keywords = [
  "organic optoelectronics",
  "OLED",
  "scientific agents",
  "graph neural network",
  "literature mining",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "agent-framework-core>=1.13.0",
  "agent-framework-openai>=1.12.0",
  "fastapi>=0.136.1",
  "httpx>=0.28.1",
  "joblib>=1.5.0",
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "openai>=2.0.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "pillow>=11.0.0",
  "pydantic>=2.11.0",
  "pymupdf>=1.26.0",
  "pypdf>=5.0.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "rdkit>=2025.3.0",
  "rich>=14.0.0",
  "scikit-learn>=1.7.0",
  "scipy>=1.15.0",
  "seaborn>=0.13.2",
  "tenacity>=9.1.0",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
modeling = [
  "catboost>=1.2.8",
  "optuna>=4.4.0",
  "pyarrow>=20.0.0",
  "torch>=2.8.0",
  "torch-geometric>=2.7.0",
]

[project.scripts]
mining-platform = "evolab_local.mining_platform.cli:app"

[project.urls]
Homepage = "https://yajingsun-group.github.io/OptoVLab/"
Repository = "https://github.com/YajingSun-Group/OptoVLab"
Issues = "https://github.com/YajingSun-Group/OptoVLab/issues"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "playwright>=1.54.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
markers = [
  "integration: tests that require external model, browser, or scientific services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.build-backend]
module-name = "evolab_local"
