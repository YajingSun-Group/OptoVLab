seed: 20260726

input_dir: analysis/oled_device_discovery/outputs
output_dir: analysis/oled_gat/outputs_campaign_gat

scope:
  eqe_min: 0.001
  eqe_max: 60.0
  require_all_eml_smiles: true
  exclude_tandem: true
  exclude_white: true
  exclude_outcoupling_layers: true
  outcoupling_roles:
    - CPL
    - outcoupling_layer

split:
  mode: within_paper_campaign
  minimum_devices_per_paper: 5
  validation_fraction: 0.15
  test_fraction: 0.15

graph:
  maximum_atoms_per_molecule: 320
  material_vocabulary_size: 2048
  minimum_material_frequency: 1
  molecular_fingerprint_size: 256

model:
  architecture: homogeneous_gat_v1
  hidden_dim: 160
  attention_heads: 4
  message_passing_layers: 4
  edge_dim: 32
  dropout: 0.14
  quantiles:
    - 0.10
    - 0.50
    - 0.90

training:
  batch_size: 56
  epochs: 280
  learning_rate: 0.0008
  weight_decay: 0.0001
  mean_mse_weight: 1.0
  quantile_loss_weight: 0.0
  use_sample_weights: false
  early_stopping_patience: 28
  gradient_clip_norm: 2.0
  num_workers: 4
  mixed_precision: true
