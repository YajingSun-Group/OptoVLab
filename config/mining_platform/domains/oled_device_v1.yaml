current_version_scope:
  included_now:
    - paper-local material entities via materials[]
    - paper_material_id links from device components to materials
    - device-level final_emitter summary
    - raw and normalized performance value fields
    - lifetime conditions
    - roll-off reference metrics
    - evidence_refs for materials, devices, layers, components, and performance
    - fabrication fields as optional metadata
    - device series and variable-factor fields as optional metadata
  intentionally_deferred:
    - LLM extraction of paper metadata
    - automatic global_material_id generation
    - mandatory SMILES or InChIKey extraction
    - uncertainty, error bars, and sample counts
    - data_quality_score
    - multi-agent provenance fields such as text_agent/table_agent/vision_agent
    - full bbox/table-row/figure-panel provenance beyond available parser output

