template_id: oled_device_v1
domain: oled
template_name: OLED Device Mining Template
version: v1
status: draft
scope: organic_small_molecule_oled
description: >
  Template for mining organic small-molecule OLED device structures,
  paper-local material entities, device stacks, performance metrics,
  and evidence anchors from literature PDFs.

paper_metadata_policy:
  source: existing_papers_table
  llm_should_extract: false
  notes: >
    DOI, title, journal, publisher, year, source_file, and PDF path are managed
    by the existing paper library. The mining LLM should not spend tokens
    extracting paper metadata unless a later consistency-check task explicitly
    asks for it.

scope_filter:
  include:
    - OLED with organic small-molecule emitter
    - fluorescent OLED
    - TADF OLED
    - MR-TADF OLED
    - hyperfluorescent OLED
    - exciplex OLED if final emitter is organic small molecule
  exclude:
    - perovskite LED
    - quantum-dot LED
    - inorganic LED
    - polymer-emitter OLED
    - organometallic phosphorescent emitter OLED
  special_case:
    - polymer host with small-molecule emitter
    - mixed host systems
    - exciplex host or exciplex emitter systems
    - white OLED
    - tandem OLED

review_policy:
  evidence_required_default: true
  allow_missing_optional_fields: true
  preserve_raw_mentions: true
  do_not_infer_missing_values: true
  smiles_required_in_device_mining: false
  first_phase_ml_target: small_molecule_final_emitter
  raw_values_for_review: true
  normalized_values_for_ml: true

entities:
  evidence:
    path: evidence[]
    label: Evidence anchors
    description: Text/table/figure/caption locations supporting extracted values.
  materials:
    path: materials[]
    label: Paper-local material entities
    description: Materials and aliases resolved within one paper before global material linking.
  devices:
    path: devices[]
    label: OLED devices
    description: One OLED device reported in a paper, table, figure, or device series.
  layers:
    path: devices[].layers[]
    label: Device layers
    description: Ordered layers in one OLED device stack.
  components:
    path: devices[].layers[].components[]
    label: Layer components
    description: Material components in one layer, referencing paper-local material IDs when possible.
  performance:
    path: devices[].performance[]
    label: Device performance
    description: Reported device performance metrics, raw values, normalized values, and test conditions.

vocabularies:
  layer_role:
    - substrate
    - anode
    - HIL
    - HTL
    - EBL
    - EML
    - HBL
    - ETL
    - EIL
    - cathode
    - CPL
    - CGL
    - recombination_layer
    - outcoupling_layer
    - buffer_layer
    - spacer_layer
    - protective_layer
    - interlayer
    - encapsulation
    - mixed_transport_layer
    - other
    - unknown

  component_role:
    - neat_material
    - host
    - co_host
    - host_donor
    - host_acceptor
    - dopant
    - emitter
    - final_emitter
    - emitter_dopant
    - sensitizer
    - sensitizer_dopant
    - assistant_dopant
    - exciplex_donor
    - exciplex_acceptor
    - transport_material
    - injection_material
    - blocking_material
    - p_dopant
    - n_dopant
    - charge_generation_material
    - electrode_material
    - optical_capping_material
    - additive
    - unknown

  emission_mechanism:
    - fluorescence
    - phosphorescence
    - TADF
    - MR_TADF
    - hyperfluorescence
    - exciplex_emission
    - RTP
    - unknown

  device_type:
    - bottom_emission
    - top_emission
    - transparent
    - tandem
    - white_OLED
    - unknown

  control_or_target:
    - control
    - target
    - optimized
    - reference
    - screening
    - unknown

  variable_factor:
    - emitter_structure
    - host_material
    - sensitizer_material
    - doping_concentration
    - EML_thickness
    - transport_layer_material
    - device_architecture
    - processing_method
    - unknown

  fabrication_method:
    - vacuum_deposition
    - thermal_evaporation
    - solution_process
    - spin_coating
    - inkjet_printing
    - blade_coating
    - hybrid_process
    - unknown

  encapsulation_status:
    - encapsulated
    - unencapsulated
    - not_reported
    - unknown

  driving_mode:
    - constant_current
    - constant_voltage
    - constant_luminance
    - pulsed
    - unknown

  atmosphere:
    - air
    - nitrogen
    - vacuum
    - glovebox
    - unknown

  material_class:
    - small_molecule_organic
    - organoboron_organic
    - organometallic_complex
    - polymer
    - salt
    - mixture
    - inorganic
    - unknown
    - proprietary
    - non_material_reference

  structure_source:
    - text
    - table
    - figure
    - scheme
    - database
    - manual
    - unknown

  metric_family:
    - EQE
    - CE
    - PE
    - luminance
    - voltage
    - current_density
    - color
    - spectrum
    - lifetime
    - rolloff
    - radiometric
    - unknown

  metric_statistic:
    - max
    - at_luminance
    - at_current_density
    - at_voltage
    - rolloff
    - LT50
    - LT80
    - LT90
    - LT95
    - CIE_1931
    - measured
    - unknown

  evidence_source_type:
    - text
    - table
    - figure
    - caption
    - scheme
    - supplementary
    - image_crop
    - unknown

ui:
  device_group_order:
    - device_identity
    - final_emitter
    - device_stack
    - layer_components
    - fabrication
    - performance
    - scope_and_notes
  default_review_entity: devices
  show_evidence_panel: true
  field_table_grouping: device

llm_output_schema:
  root: object
  required_keys:
    - evidence
    - materials
    - devices
  excluded_keys:
    - paper
  json_shape:
    evidence:
      - evidence_id: string
        source_type: string
        source_location: string | null
        source_text: string | null
        page_id: integer | null
        block_id: string | null
        bbox: list[number]
    materials:
      - paper_material_id: string
        global_material_id: string | null
        mention_list: list[string]
        full_name_in_paper: string | null
        normalized_name: string | null
        canonical_name: string | null
        abbreviation: string | null
        paper_specific_label: string | null
        material_class: string | null
        smiles: string | null
        inchi: string | null
        inchi_key: string | null
        structure_source: string | null
        structure_confidence: number | null
        evidence_refs: list[string]
    devices:
      - device_label: string | null
        device_series_id: string | null
        control_or_target: string | null
        variable_factor: list[string]
        device_type: string | null
        emission_mechanism: list[string]
        architecture_text: string | null
        final_emitter: object | null
        fabrication: object | null
        layers: list[object]
        performance: list[object]
        evidence_refs: list[string]

fields:
  - field_path: evidence[].evidence_id
    label: Evidence ID
    data_type: string
    required: true
    entity: evidence
    review_priority: high

  - field_path: evidence[].source_type
    label: Evidence source type
    data_type: enum
    enum_ref: evidence_source_type
    required: true
    entity: evidence
    review_priority: high

  - field_path: evidence[].source_location
    label: Evidence source location
    data_type: string
    required: false
    entity: evidence
    review_priority: medium
    extraction_hint: Preserve labels such as Table 1, Figure 3b, Scheme 1, or Supplementary Table S2.

  - field_path: evidence[].source_text
    label: Evidence source text
    data_type: string
    required: false
    entity: evidence
    review_priority: high

  - field_path: evidence[].page_id
    label: Evidence page
    data_type: integer
    required: false
    entity: evidence
    review_priority: medium

  - field_path: evidence[].block_id
    label: Evidence block ID
    data_type: string
    required: false
    entity: evidence
    review_priority: medium

  - field_path: evidence[].bbox
    label: Evidence bounding box
    data_type: list_number
    required: false
    entity: evidence
    review_priority: low

  - field_path: materials[].paper_material_id
    label: Paper material ID
    data_type: string
    required: true
    entity: material
    review_priority: high
    extraction_hint: Assign stable IDs within the paper, such as M001, M002, M003.

  - field_path: materials[].global_material_id
    label: Global material ID
    data_type: string
    required: false
    entity: material
    review_priority: low
    extraction_hint: Reserved for later cross-paper material resolver; leave null in device mining.

  - field_path: materials[].mention_list
    label: Material mentions
    data_type: list_string
    required: true
    entity: material
    evidence_required: true
    review_priority: high
    extraction_hint: All names, abbreviations, and paper-specific labels that refer to the same material.

  - field_path: materials[].full_name_in_paper
    label: Full name in paper
    data_type: string
    required: false
    entity: material
    evidence_required: true
    review_priority: high
    extraction_hint: Use only the full expanded material name explicitly written in the paper. Do not infer or complete a full name from external knowledge. Use null when the paper only provides an abbreviation, acronym, or paper-specific label.

  - field_path: materials[].normalized_name
    label: Normalized material name
    data_type: string
    required: false
    entity: material
    review_priority: medium

  - field_path: materials[].canonical_name
    label: Canonical material name
    data_type: string
    required: false
    entity: material
    review_priority: low

  - field_path: materials[].abbreviation
    label: Material abbreviation
    data_type: string
    required: false
    entity: material
    evidence_required: true
    review_priority: high

  - field_path: materials[].paper_specific_label
    label: Paper-specific material label
    data_type: string
    required: false
    entity: material
    evidence_required: true
    review_priority: high

  - field_path: materials[].material_class
    label: Material class
    data_type: enum
    enum_ref: material_class
    required: false
    entity: material
    review_priority: high

  - field_path: materials[].smiles
    label: SMILES
    data_type: string
    required: false
    entity: material
    review_priority: low
    extraction_hint: Reserved for material resolver; do not invent SMILES.

  - field_path: materials[].inchi
    label: InChI
    data_type: string
    required: false
    entity: material
    review_priority: low
    extraction_hint: Reserved for material resolver.

  - field_path: materials[].inchi_key
    label: InChIKey
    data_type: string
    required: false
    entity: material
    review_priority: low
    extraction_hint: Reserved for material resolver.

  - field_path: materials[].structure_source
    label: Structure source
    data_type: enum
    enum_ref: structure_source
    required: false
    entity: material
    review_priority: medium

  - field_path: materials[].structure_confidence
    label: Structure confidence
    data_type: number
    required: false
    entity: material
    review_priority: medium
    validation:
      min: 0
      max: 1

  - field_path: materials[].evidence_refs
    label: Material evidence references
    data_type: list_string
    required: false
    entity: material
    evidence_required: true
    review_priority: high

  - field_path: devices[].device_label
