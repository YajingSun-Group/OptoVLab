runtime:
  root: ./runtime/optovlab
  sqlite_path: ./runtime/optovlab/optovlab.sqlite
  artifact_dir: ./runtime/optovlab/artifacts

datasets:
  oled_devices: ./apps/database-web/public/data/oled.json.gz

modeling:
  project_dir: ./analysis/oled_gat
  default_config: ./analysis/oled_gat/configs/campaign_gat.yaml
  allowed_partitions:
    - rtx5880
    - rtx3090
  default_partition: rtx5880
  default_gpus: 1
  default_time_limit: "08:00:00"

agents:
  provider: deepseek
  model_env: DEEPSEEK_DEFAULT_MODEL
  base_url_env: DEEPSEEK_BASE_URL
  api_key_env: DEEPSEEK_API_KEY
  request_timeout_seconds: 180

retrieval:
  maximum_features: 24000
  default_top_k: 8
  maximum_top_k: 25
